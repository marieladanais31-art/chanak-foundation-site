<svg xmlns="http://www.w3.org/2000/svg" width="400" height="120" viewBox="0 0 400 120" role="img" aria-label="Chanak Foundation Logo">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B365D" />
      <stop offset="100%" stop-color="#0F2038" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#C9A84C" />
    </linearGradient>
  </defs>
  
  <!-- Crest / Shield -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield -->
    <path d="M50 0 C78 0, 100 12, 100 42 C100 78, 62 95, 50 100 C38 95, 0 78, 0 42 C0 12, 22 0, 50 0 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3" />
    <!-- Inner Book & Sun / Light rays -->
    <path d="M28 58 C38 52, 50 54, 50 54 C50 54, 62 52, 72 58 L72 38 C62 34, 50 36, 50 36 C50 36, 38 34, 28 38 Z" fill="#ffffff" opacity="0.95" />
    <path d="M50 36 L50 54" stroke="#1B365D" stroke-width="2" />
    <!-- Torch / Star of Knowledge -->
    <circle cx="50" cy="24" r="5" fill="url(#goldGrad)" />
    <path d="M50 14 L50 17 M50 31 L50 34 M40 24 L43 24 M57 24 L60 24" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
  </g>
  
  <!-- Brand Typography -->
  <text x="125" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="900" fill="#ffffff" letter-spacing="-0.5">Chanak</text>
  <text x="245" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="400" fill="#C9A84C" letter-spacing="-0.5">Foundation</text>
  <text x="126" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1.2">CHANAK TRAINUP EDUCATION, INC. · 501(c)(3)</text>
</svg>
